<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Centro de Control | Armadillo Tacticals</title>
<link rel="stylesheet" href="../base.css">
</head>
<body data-root="../">
<header></header>
<main class="wrap stack">
  <h1 style="font-size:var(--t4)">Centro de Control</h1>
  <p class="muted">Registros de taller, entrenamiento y planeación: se guardan como Markdown en tu repositorio privado y se avisa por Discord.</p>

  <div class="card stack">
    <p id="st" class="small gold" aria-live="polite">Escribe la clave para poder guardar.</p>
    <div><label for="clave">Clave del Centro</label><input id="clave" type="password" autocomplete="off" placeholder="Se guarda solo en este navegador"></div>
  </div>

  <div class="tags" id="tabs"></div>
  <form id="f" class="card stack" autocomplete="off"></form>
</main>
<footer></footer>
<script src="../site.js"></script>
<script>
// Cada formulario se describe con datos; "carga" = minutos × campo indicado
const FORMS = {
  proyecto: { titulo: "Taller y proyectos", boton: "Guardar proyecto", campos: [
    ["id", "ID / Código de proyecto", "text", "armadillo-mod-01"],
    ["estado", "Estado", ["Diseño / Planos", "En proceso / Taller", "Completado"]],
    ["nombre", "Nombre del proyecto o pieza", "text", "Soporte modular para equipo táctico"],
    ["materiales", "Materiales y perfiles", "text", "Acero al carbón 1/8, soldadura MIG"],
    ["especificaciones", "Especificaciones técnicas / medidas", "area", "Cortes, tolerancias, ángulos…"] ],
    archivo: v => v.id, encabezado: v => v.nombre, estado: v => slug(v.estado) },
  entrenamiento: { titulo: "Entrenamiento", boton: "Guardar sesión", carga: "rpe", campos: [
    ["id", "ID de sesión", "text", "sesion-2026-01"],
    ["enfoque", "Enfoque", ["Gimnasia / Movilidad", "Fuerza / Resistencia", "Técnica pura"]],
    ["minutos", "Minutos", "number", 45],
    ["rpe", "RPE (1-10)", "number", 7],
    ["detalle", "Detalle de la sesión", "text", "Trabajo de suelo, flexibilidad de cadena posterior"],
    ["notas", "Sensaciones / observaciones", "area", "Fluidez, rangos de movimiento, fatiga…"] ],
    archivo: v => v.id, encabezado: v => v.detalle },
  plan: { titulo: "Plan semanal", boton: "Guardar bloque", carga: "intensidad", campos: [
    ["id", "ID / Título del plan", "text", "semana-2026-44"],
    ["dia", "Día", ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"]],
    ["minutos", "Minutos", "number", 60],
    ["intensidad", "Intensidad (1-10)", "number", 5],
    ["objetivo", "Objetivo / Tarea", "text", "Soldadura de chasis / Sesión técnica"],
    ["materiales", "Materiales / recursos", "text", "Electrodo 6013, acero estructural"],
    ["notas", "Notas / observaciones", "area", "Parámetros de seguridad a tener en cuenta…"] ],
    archivo: v => v.id + "-" + v.dia, encabezado: v => v.objetivo, estado: () => "pendiente" }
};

const slug = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const req = ([k]) => !["materiales", "especificaciones", "notas"].includes(k);
const f = $("f"), say = m => $("st").textContent = m;
let actual = "proyecto";

// ---- Interfaz ----
$("tabs").innerHTML = Object.entries(FORMS).map(([k, x]) => `<button class="chip" type="button" data-k="${k}">${x.titulo}</button>`).join("");
$("tabs").onclick = e => { const b = e.target.closest("[data-k]"); if (b) abrir(b.dataset.k); };

function abrir(k) {
  actual = k;
  const x = FORMS[k];
  document.querySelectorAll("#tabs .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
  f.innerHTML = `<h2 style="font-size:var(--t2)">${x.titulo}</h2><div class="fit" style="--min:12rem">` + x.campos.map(c => {
    const [n, et, tipo, ej] = c, id = "c-" + n;
    const ctl = Array.isArray(tipo) ? `<select id="${id}">${tipo.map(o => `<option>${o}</option>`).join("")}</select>`
      : tipo === "area" ? `<textarea id="${id}" rows="3" placeholder="${esc(ej)}"></textarea>`
      : `<input id="${id}" type="${tipo}" ${tipo === "number" ? `value="${ej}" min="1"` : `placeholder="${esc(ej)}"`} ${req(c) ? "required" : ""}>`;
    return `<div${tipo === "area" ? ' style="grid-column:1/-1"' : ""}><label for="${id}">${et}</label>${ctl}</div>`;
  }).join("") + `</div>` +
    (x.carga ? `<p class="gold">Carga: <b id="carga"></b> (minutos × ${x.carga === "rpe" ? "RPE" : "intensidad"})</p>` : "") +
    `<button class="btn" type="submit">${x.boton}</button>`;
  calcular();
}
const valores = () => Object.fromEntries(FORMS[actual].campos.map(([n]) => [n, $("c-" + n).value.trim()]));
const calcular = () => { const x = FORMS[actual]; if (x.carga) $("carga").textContent = ($("c-minutos").value || 0) * ($("c-" + x.carga).value || 0); };
f.addEventListener("input", calcular);

// ---- Guardado: /api/registro (GitHub + Discord) ----
try { $("clave").value = localStorage.getItem("armadillo-clave") || ""; } catch (e) {}
$("clave").addEventListener("change", () => { try { localStorage.setItem("armadillo-clave", $("clave").value.trim()); } catch (e) {} });

f.addEventListener("submit", async e => {
  e.preventDefault();
  const clave = $("clave").value.trim();
  if (!clave) return say("Escribe la clave del Centro.");
  const x = FORMS[actual], v = valores(), c = $("carga")?.textContent;
  const md = `---\ntipo: ${actual}\nid: ${slug(v.id)}\nfecha: ${new Date().toISOString().slice(0, 10)}\n${x.estado ? "estado: " + x.estado(v) + "\n" : ""}---\n\n# ${x.encabezado(v)}\n\n` +
    x.campos.filter(([, , t]) => t !== "area").map(([n, et]) => `- **${et}:** ${v[n]}`).join("\n") + (c ? `\n- **Carga:** ${c}` : "") +
    x.campos.filter(([, , t]) => t === "area").map(([n, et]) => `\n\n## ${et}\n${v[n]}`).join("") + "\n";
  try {
    const r = await fetch("/api/registro", { method: "POST", headers: { "Content-Type": "application/json", "x-clave": clave },
      body: JSON.stringify({ tipo: actual, id: x.archivo(v), markdown: md }) });
    if (r.status === 401) throw new Error("clave incorrecta");
    if (!r.ok) throw new Error("error " + r.status);
    const { canales = {} } = await r.json();
    say(canales.github && canales.discord ? "Guardado en el repositorio y enviado a Discord."
      : canales.github ? "Guardado en el repositorio, pero Discord falló."
      : "ATENCIÓN: solo llegó a Discord; el repositorio falló.");
    f.reset(); calcular();
  } catch (er) { say("No se pudo guardar: " + er.message); }
});

abrir("proyecto");
</script>
</body>
</html>
